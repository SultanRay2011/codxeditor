<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="description" content="The HTML file requested by the CodX Editor project preview does not exist." />
    <title>404 | Preview File Not Found | CodX Editor</title>
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="cx.png" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="site-enhancements.css?v=20260712" />
    <style>
      :root {
        --bg-primary: #ffffff;
        --text-primary: #333333;
        --text-secondary: #666666;
        --accent-color: #4caf50;
        --box-bg: #f5f5f5;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        width: 100%;
        padding: 40px;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        background-color: var(--box-bg);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      .logo {
        margin-bottom: 20px;
      }

      .logo img {
        width: 70px;
        height: 70px;
      }

      .error-code {
        font-size: 6rem;
        font-weight: 700;
        color: var(--accent-color);
        margin-bottom: 5px;
        line-height: 1;
      }

      .error-message {
        font-size: 1.6rem;
        margin-bottom: 15px;
        color: var(--text-primary);
      }

      .description {
        font-size: 1rem;
        color: var(--text-secondary);
        margin-bottom: 14px;
        line-height: 1.6;
      }

      .missing-file {
        margin-bottom: 30px;
        font-family: "Consolas", "Courier New", monospace;
        color: #b45309;
        word-break: break-word;
      }

      .button-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      .home-link,
      .editor-link {
        display: inline-block;
        text-decoration: none;
        padding: 12px 25px;
        border-radius: 6px;
        font-weight: bold;
        transition: background-color 0.3s ease, transform 0.1s ease;
        flex: 0 1 auto;
      }

      .editor-link {
        background-color: var(--accent-color);
        color: #ffffff;
        border: 2px solid var(--accent-color);
      }

      .editor-link:hover {
        background-color: #45a049;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      .home-link {
        background-color: transparent;
        color: var(--text-primary);
        border: 2px solid var(--text-secondary);
      }

      .home-link:hover {
        border-color: var(--accent-color);
        color: var(--accent-color);
      }

      .editor-link:active,
      .home-link:active {
        transform: scale(0.98);
      }

      @media (max-width: 768px) {
        .container {
          padding: 35px 30px;
        }

        .logo img {
          width: 60px;
          height: 60px;
        }

        .error-code {
          font-size: 5rem;
        }

        .error-message {
          font-size: 1.4rem;
        }

        .description {
          font-size: 0.95rem;
        }

        .home-link,
        .editor-link {
          padding: 11px 22px;
          font-size: 0.95rem;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 15px;
        }

        .container {
          padding: 30px 20px;
          border-radius: 10px;
        }

        .logo {
          margin-bottom: 15px;
        }

        .logo img {
          width: 50px;
          height: 50px;
        }

        .error-code {
          font-size: 4rem;
          margin-bottom: 10px;
        }

        .error-message {
          font-size: 1.2rem;
          margin-bottom: 12px;
        }

        .description {
          font-size: 0.9rem;
          margin-bottom: 12px;
          line-height: 1.5;
        }

        .missing-file {
          margin-bottom: 25px;
          font-size: 0.9rem;
        }

        .button-group {
          flex-direction: column;
          gap: 12px;
        }

        .home-link,
        .editor-link {
          width: 100%;
          padding: 12px 20px;
          font-size: 0.95rem;
        }
      }

      @media (max-width: 360px) {
        body {
          padding: 12px;
        }

        .container {
          padding: 25px 18px;
        }

        .logo img {
          width: 45px;
          height: 45px;
        }

        .error-code {
          font-size: 3.5rem;
        }

        .error-message {
          font-size: 1.1rem;
        }

        .description,
        .missing-file {
          font-size: 0.85rem;
        }

        .home-link,
        .editor-link {
          padding: 11px 18px;
          font-size: 0.9rem;
        }
      }
    </style>
</head>
  <body class="site-refurbished page-preview-missing">
    <div class="container">
      <svg class="utility-illustration" viewBox="0 0 320 190" role="img" aria-labelledby="previewMissingIllustrationTitle">
        <title id="previewMissingIllustrationTitle">A project file path disconnected from a browser preview</title>
        <rect x="20" y="34" width="112" height="130" rx="15" fill="#fdf2f8" stroke="#db2777" stroke-width="3"/>
        <path d="M46 70h60M46 93h46M46 116h55" stroke="#f9a8d4" stroke-width="7" stroke-linecap="round"/>
        <path d="M142 98h48" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 7"/>
        <circle cx="166" cy="98" r="13" fill="#fff" stroke="#ef4444" stroke-width="3"/><path d="M160 92l12 12m0-12l-12 12" stroke="#ef4444" stroke-width="3"/>
        <rect x="198" y="48" width="102" height="102" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
        <rect x="214" y="68" width="70" height="16" rx="8" fill="#bfdbfe"/><path d="M227 107l13 12 28-30" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <div class="logo">
        <img src="cx.png" alt="CodX Editor Logo" />
      </div>
      <div class="error-code">404</div>
      <h1 class="error-message">Preview File Not Found</h1>
      <p class="description">
        The file path used in your preview link is missing or incorrect. Check
        the exact spelling, extension, dashes, folders, and letter case. Then update the link in your HTML and run the preview again.
      </p>
      <p class="missing-file" id="missingFile"></p>
      <div class="button-group">
        <a href="frontend.html" target="_top" class="editor-link">Return to CodX Editor</a>
        <a href="help.html#preview" target="_top" class="home-link">Preview troubleshooting</a>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const rawMissingFile = params.get("file");

      function getDisplayFileName(value) {
        if (!value) return "";
        let decoded = value;
        try {
          decoded = decodeURIComponent(value);
        } catch (e) {}

        const nestedMatch = decoded.match(/[?&]file=([^&]+)/i);
        if (nestedMatch) {
          try {
            decoded = decodeURIComponent(nestedMatch[1]);
          } catch (e) {
            decoded = nestedMatch[1];
          }
        }

        return decoded.split("/").pop();
      }

      const displayFile = getDisplayFileName(rawMissingFile);
      if (displayFile) {
        document.getElementById("missingFile").textContent = displayFile;
      }
    </script>
  </body>
</html>
